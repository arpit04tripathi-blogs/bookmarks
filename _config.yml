# YAML syntax : https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/

# Site settings ============================================================================
# {{ site.title }}, {{ site.email }}, and so on.
title: Bookmarks
description: >- # this means to ignore newlines until "baseurl:"
  Bookmarks
baseurl: "/bookmarks" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings ============================================================================

# For gh-pages default supported theme
# theme: minima
# theme: jekyll-theme-leaf

# For custom themes
remote_theme: https://github.com/supunkavinda/jekyll-theme-leaf

# social icons
github_username: arpit04tripathi

plugins:
  - jekyll-feed

# Exclude from processing. ==================================================================
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.

exclude:
  - scripts/
  - docker/
  - README.md
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
  - Gemfile
  - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Collections ===============================================================================
collections:
  my_pages:
    output: true
